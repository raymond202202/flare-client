name: native-windows

# 出 Windows 原生安装包：flare-<ver>-win-x64-setup.exe
# 壳 = WPF/.NET Framework 4.8（Win10 1809+ 自带运行时，用户零依赖），引擎内置 flare.exe。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空=取 tag 或 0.0.0-dev.<sha>）"
        required: false
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "native/windows/**"
      - ".github/workflows/native-windows.yml"

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest      # x64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 版本号
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $v = "0.0.0-dev." + "${{ github.sha }}".Substring(0,7)
          }
          # AssemblyVersion / FileVersion / NSIS VIProductVersion 只认纯数字段，
          # 传 0.0.0-dev.xxxx 会撞 MC1005 Invalid AssemblyVersion。显示版本留完整串，
          # 数字版本单独给：正式 tag 取 x.y.z，dev 构建用 run number 保证单调递增。
          if ($v -match '^(\d+)\.(\d+)\.(\d+)$' -or $v -match '^(\d+)\.(\d+)\.(\d+)[-.+]') {
            $num = "$($matches[1]).$($matches[2]).$($matches[3])"
          } else {
            $num = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "numver=$num" >> $env:GITHUB_OUTPUT
          Write-Host "VERSION=$v NUMVER=$num"

      # ---------- 引擎（Go / windows amd64，CGO 关闭） ----------
      - name: 取引擎源码
        shell: pwsh
        env:
          ENGINE_SSH_KEY: ${{ secrets.ENGINE_SSH_KEY }}
        run: |
          $dir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          ssh-keyscan -t ed25519 github.com 2>$null | Out-File -Append -Encoding ascii "$dir\known_hosts"
          # 去掉 CRLF：OpenSSH 只认 LF，且私钥文件必须以换行结尾，否则报
          # 'Load key ...: invalid format'（Windows runner 上踩过）
          $key = ($env:ENGINE_SSH_KEY -replace "`r","").TrimEnd("`n") + "`n"
          # 用 OpenSSH 而非 putty：写文件后靠 GIT_SSH_COMMAND 指定，避免 agent 平台差异
          # WriteAllText：不经 Set-Content 的编码/BOM 推断，保证字节级干净
          [System.IO.File]::WriteAllText("$dir\engine_key", $key)
          icacls "$dir\engine_key" /inheritance:r /grant:r "${env:USERNAME}:R" | Out-Null
          git config --global core.sshCommand "ssh -i `"$dir/engine_key`" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:raymond202202/flare.git engine
          if ($LASTEXITCODE -ne 0) { throw "引擎仓 clone 失败" }
          Push-Location engine; Write-Host "engine commit: $(git rev-parse --short HEAD)"; Pop-Location

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: 编译引擎（windows/amd64）
        shell: pwsh
        run: |
          Push-Location engine
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w" -o "../native/windows/engine/flare.exe" ./cmd/flare
          if ($LASTEXITCODE -ne 0) { throw "引擎编译失败" }
          Pop-Location
          & ./native/windows/engine/flare.exe --version

      # ---------- 客户端（WPF / net48） ----------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 编译 WPF 壳
        shell: pwsh
        run: |
          msbuild native/windows/FlareWin.csproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:Version=${{ steps.v.outputs.version }} `
            /p:FileVersion=${{ steps.v.outputs.numver }}.0 `
            /p:AssemblyVersion=${{ steps.v.outputs.numver }}.0 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "WPF 编译失败" }

      - name: 组装安装包源目录
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Recurse -Directory -Filter net48 native/windows/bin |
                 Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $bin) { throw "找不到 bin\Release\net48 输出目录" }
          Write-Host "输出目录: $($bin.FullName)"
          $pkg = "native/windows/dist/pkg"
          Remove-Item -Recurse -Force native/windows/dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pkg/engine" | Out-Null
          Copy-Item "$($bin.FullName)\Flare.exe" $pkg
          Copy-Item "$($bin.FullName)\Newtonsoft.Json.dll" $pkg
          Copy-Item "$($bin.FullName)\engine\flare.exe" "$pkg/engine" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$pkg/engine/flare.exe")) {
            Copy-Item "native/windows/engine/flare.exe" "$pkg/engine"
          }
          # net48 项目没 App.config 时不会生成 Flare.exe.config，NSIS 里 File 指令要求它存在
          if (Test-Path "$($bin.FullName)\Flare.exe.config") {
            Copy-Item "$($bin.FullName)\Flare.exe.config" $pkg
          } else {
            New-Item -ItemType File -Path "$pkg/Flare.exe.config" | Out-Null
          }
          Copy-Item "native/windows/README-WINDOWS.txt" "$pkg/README.txt"
          Get-ChildItem -Recurse $pkg | Select-Object FullName, Length | Format-Table -AutoSize

      # 无人值守 GUI 取证：跑真实的 exe，把「只能看像素」的东西落成图片 ——
      # 菜单 emoji 到底画没画出来、置顶行的 📌 有没有缺字形、搜索高亮是不是琥珀色，
      # 这些都不是编译器能回答的问题，必须看图。WPF 走 RenderTargetBitmap
      # 自渲染，不依赖 runner 有没有显示器 / 会不会锁屏。
      - name: GUI 自截图取证
        shell: pwsh
        run: |
          $pkg = "native/windows/dist/pkg"
          $shots = "native/windows/dist/shots"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $env:FLARE_GUI_DEMO      = "1"          # 无引擎数据时灌样本会话
          $env:FLARE_GUI_DEMO_PIN  = "demo-2,demo-5"  # 造出「📌 置顶」组
          $env:FLARE_GUI_MENU      = "demo-2"     # 右键菜单单独出图（emoji 主战场）
          $env:FLARE_GUI_SEARCH    = "WARP"       # 搜索高亮
          $env:FLARE_GUI_SHOT_QUIT = "1"
          $env:FLARE_GUI_SHOT      = (Resolve-Path $shots).Path
          $env:FLARE_BIN           = (Resolve-Path "$pkg/engine/flare.exe").Path
          $exe = (Resolve-Path "$pkg/Flare.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Warning "GUI 自截图超时，已强杀" }
          $files = Get-ChildItem $shots -Filter *.png -ErrorAction SilentlyContinue
          if (-not $files) { throw "GUI 自截图未产出任何 png" }
          $files | Select-Object Name, Length | Format-Table -AutoSize

      - name: 上传 GUI 截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flare-windows-shots-${{ steps.v.outputs.version }}
          path: native/windows/dist/shots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: NSIS 打包
        shell: pwsh
        run: |
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) {
            choco install nsis -y --no-progress | Out-Null
            $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not (Test-Path $mk)) { throw "找不到 makensis" }
          Push-Location native/windows
          & $mk -INPUTCHARSET UTF8 `
            "-DVERSION=${{ steps.v.outputs.version }}" `
            "-DNUMVERSION=${{ steps.v.outputs.numver }}" `
            "-DSRCDIR=dist\pkg" `
            "-DOUTDIR=dist" `
            installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败" }
          Pop-Location
          Get-ChildItem native/windows/dist/*.exe | Select-Object Name, Length

      - name: 校验安装包
        shell: pwsh
        run: |
          $setup = "native/windows/dist/flare-${{ steps.v.outputs.version }}-win-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "安装包未生成：$setup" }
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "安装包大小: $mb MB"
          if ($mb -gt 20) { Write-Warning "超过飞书单文件 20MB 上限，需要拆分或换分发方式" }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: flare-windows-x64-${{ steps.v.outputs.version }}
          path: native/windows/dist/flare-*-setup.exe
          if-no-files-found: error
          retention-days: 30
