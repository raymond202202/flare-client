name: native-windows

# 出 Windows 原生安装包：flare-<ver>-win-x64-setup.exe
# 壳 = WPF/.NET Framework 4.8（Win10 1809+ 自带运行时，用户零依赖），引擎内置 flare.exe。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空=取 tag 或 0.0.0-dev.<sha>）"
        required: false
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "native/windows/**"
      - ".github/workflows/native-windows.yml"

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest      # x64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 版本号
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            # dev 构建：版本主体从 CMakeLists.txt 的 project(flare-client VERSION …) 取，
            # 与 Fedora 客户端同源。否则 WPF 的 AssemblyVersion 会退化成 0.0.0.0，
            # 侧栏显示「Flare v0.0.0」，属性页与安装包也都是假版本号。
            $m = Select-String -Path 'CMakeLists.txt' -Pattern 'project\(flare-client VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
            if ($m) { $base = $m.Matches[0].Groups[1].Value } else { $base = '0.0.0' }
            $v = "$base-dev." + "${{ github.sha }}".Substring(0,7)
          }
          # AssemblyVersion / FileVersion / NSIS VIProductVersion 只认纯数字段，
          # 传 0.0.0-dev.xxxx 会撞 MC1005 Invalid AssemblyVersion。显示版本留完整串，
          # 数字版本单独给：正式 tag 取 x.y.z，dev 构建用 run number 保证单调递增。
          if ($v -match '^(\d+)\.(\d+)\.(\d+)$' -or $v -match '^(\d+)\.(\d+)\.(\d+)[-.+]') {
            $num = "$($matches[1]).$($matches[2]).$($matches[3])"
          } else {
            $num = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "numver=$num" >> $env:GITHUB_OUTPUT
          Write-Host "VERSION=$v NUMVER=$num"

      # ---------- 引擎（Go / windows amd64，CGO 关闭） ----------
      - name: 取引擎源码
        shell: pwsh
        env:
          ENGINE_SSH_KEY: ${{ secrets.ENGINE_SSH_KEY }}
        run: |
          $dir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          ssh-keyscan -t ed25519 github.com 2>$null | Out-File -Append -Encoding ascii "$dir\known_hosts"
          # 去掉 CRLF：OpenSSH 只认 LF，且私钥文件必须以换行结尾，否则报
          # 'Load key ...: invalid format'（Windows runner 上踩过）
          $key = ($env:ENGINE_SSH_KEY -replace "`r","").TrimEnd("`n") + "`n"
          # 用 OpenSSH 而非 putty：写文件后靠 GIT_SSH_COMMAND 指定，避免 agent 平台差异
          # WriteAllText：不经 Set-Content 的编码/BOM 推断，保证字节级干净
          [System.IO.File]::WriteAllText("$dir\engine_key", $key)
          icacls "$dir\engine_key" /inheritance:r /grant:r "${env:USERNAME}:R" | Out-Null
          git config --global core.sshCommand "ssh -i `"$dir/engine_key`" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:raymond202202/flare.git engine
          if ($LASTEXITCODE -ne 0) { throw "引擎仓 clone 失败" }
          Push-Location engine; Write-Host "engine commit: $(git rev-parse --short HEAD)"; Pop-Location

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: 编译引擎（windows/amd64）
        shell: pwsh
        run: |
          Push-Location engine
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w" -o "../native/windows/engine/flare.exe" ./cmd/flare
          if ($LASTEXITCODE -ne 0) { throw "引擎编译失败" }
          Pop-Location
          & ./native/windows/engine/flare.exe --version

      # ---------- 客户端（WPF / net48） ----------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 编译 WPF 壳
        shell: pwsh
        run: |
          msbuild native/windows/FlareWin.csproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:TargetFramework=net48 `
            /p:Version=${{ steps.v.outputs.version }} `
            /p:FileVersion=${{ steps.v.outputs.numver }}.0 `
            /p:AssemblyVersion=${{ steps.v.outputs.numver }}.0 `
            /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "WPF 编译失败" }

      - name: 组装安装包源目录
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Recurse -Directory -Filter net48 native/windows/bin |
                 Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $bin) { throw "找不到 bin\Release\net48 输出目录" }
          Write-Host "输出目录: $($bin.FullName)"
          $pkg = "native/windows/dist/pkg"
          Remove-Item -Recurse -Force native/windows/dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pkg/engine" | Out-Null
          Copy-Item "$($bin.FullName)\Flare.exe" $pkg
          Copy-Item "$($bin.FullName)\Newtonsoft.Json.dll" $pkg
          Copy-Item "$($bin.FullName)\engine\flare.exe" "$pkg/engine" -ErrorAction SilentlyContinue
          if (-not (Test-Path "$pkg/engine/flare.exe")) {
            Copy-Item "native/windows/engine/flare.exe" "$pkg/engine"
          }
          # net48 项目没 App.config 时不会生成 Flare.exe.config，NSIS 里 File 指令要求它存在
          if (Test-Path "$($bin.FullName)\Flare.exe.config") {
            Copy-Item "$($bin.FullName)\Flare.exe.config" $pkg
          } else {
            New-Item -ItemType File -Path "$pkg/Flare.exe.config" | Out-Null
          }
          Copy-Item "native/windows/README-WINDOWS.txt" "$pkg/README.txt"
          Get-ChildItem -Recurse $pkg | Select-Object FullName, Length | Format-Table -AutoSize

      # runner 是 Windows Server，字体比桌面版 Windows 精简。emoji 画不出来
      # 到底是「字体文件压根不在」还是「字体在但 WPF 没选中」，得先有事实。
      #
      # 注意：这里必须 shell: powershell（5.1，才有 WPF），而 5.1 读无 BOM 的
      # UTF-8 脚本会按 ANSI(GBK) 解码 —— 中文一旦出现在脚本里就是 ParserError。
      # 所以本步所有输出标签一律 ASCII，别图省事写中文。
      - name: 字体诊断
        shell: powershell
        run: |
          "seguiemj.ttf : $(Test-Path C:\Windows\Fonts\seguiemj.ttf)"
          "seguisym.ttf : $(Test-Path C:\Windows\Fonts\seguisym.ttf)"
          "msyh.ttc     : $(Test-Path C:\Windows\Fonts\msyh.ttc)"
          Add-Type -AssemblyName PresentationCore
          $fams = [System.Windows.Media.Fonts]::SystemFontFamilies | ForEach-Object { $_.Source }
          "font families total : $($fams.Count)"
          "--- matched families ---"
          $fams | Where-Object { $_ -match 'Emoji|Symbol|YaHei|Segoe' }
          "--- composite resolution ---"
          $ff = New-Object System.Windows.Media.FontFamily("Segoe UI Emoji, Segoe UI, Microsoft YaHei UI")
          "FamilyNames : $($ff.FamilyNames.Values -join '|')"
          $tf = New-Object System.Windows.Media.Typeface($ff, [System.Windows.FontStyles]::Normal, [System.Windows.FontWeights]::Normal, [System.Windows.FontStretches]::Normal)
          $gt = $null
          "TryGetGlyphTypeface : $($tf.TryGetGlyphTypeface([ref]$gt))"
          if ($gt) { "resolved font file : $($gt.FontUri)" }

      # 无人值守 GUI 取证：跑真实的 exe，把「只能看像素」的东西落成图片 ——
      # 菜单 emoji 到底画没画出来、置顶行的 📌 有没有缺字形、搜索高亮是不是琥珀色，
      # 这些都不是编译器能回答的问题，必须看图。WPF 走 RenderTargetBitmap
      # 自渲染，不依赖 runner 有没有显示器 / 会不会锁屏。
      - name: GUI 自截图取证
        shell: pwsh
        run: |
          $pkg = "native/windows/dist/pkg"
          $shots = "native/windows/dist/shots"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $env:FLARE_GUI_DEMO      = "1"          # 无引擎数据时灌样本会话
          $env:FLARE_GUI_DEMO_PIN  = "demo-2,demo-5"  # 造出「📌 置顶」组
          $env:FLARE_GUI_MENU      = "demo-2"     # 右键菜单单独出图（emoji 主战场）
          $env:FLARE_GUI_SEARCH    = "WARP"       # 搜索高亮
          $env:FLARE_GUI_SHOT_QUIT = "1"
          $env:FLARE_GUI_SHOT      = (Resolve-Path $shots).Path
          $env:FLARE_GUI_LOG       = Join-Path (Resolve-Path $shots).Path "gui.log"
          $env:FLARE_BIN           = (Resolve-Path "$pkg/engine/flare.exe").Path
          $exe = (Resolve-Path "$pkg/Flare.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Warning "GUI 自截图超时，已强杀" }
          if (Test-Path $env:FLARE_GUI_LOG) {
            Write-Host "== gui.log (last 40) =="
            Get-Content -Encoding UTF8 $env:FLARE_GUI_LOG | Select-Object -Last 40
          } else { Write-Host "== gui.log missing ==" }
          $files = Get-ChildItem $shots -Filter *.png -ErrorAction SilentlyContinue
          if (-not $files) { throw "GUI 自截图未产出任何 png" }
          $files | Select-Object Name, Length | Format-Table -AutoSize

      # 峰值工作集采样：单独起一次实例，只测内存不出图，避免与上面的截图轮次
      # 抢资源导致数字失真。net48 壳 vs net6 自包含壳在相同的 DEMO 数据集下对比。
      - name: 内存采样（标准版 / WPF net48）
        shell: pwsh
        run: |
          $pkg   = "native/windows/dist/pkg"
          $shots = "native/windows/dist/shots"
          $env:FLARE_GUI_DEMO      = "1"
          $env:FLARE_GUI_DEMO_PIN  = "demo-2,demo-5"
          $env:FLARE_GUI_SHOT_QUIT = "1"
          $env:FLARE_GUI_SHOT      = (Resolve-Path $shots).Path
          $env:FLARE_GUI_LOG       = Join-Path (Resolve-Path $shots).Path "gui-mem.log"
          $env:FLARE_BIN           = (Resolve-Path "$pkg/engine/flare.exe").Path
          $exe = (Resolve-Path "$pkg/Flare.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          $peak = 0; $n = 0
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep -Milliseconds 250
            if ($p.HasExited) { break }
            try { $p.Refresh(); if ($p.WorkingSet64 -gt $peak) { $peak = $p.WorkingSet64 }; $n++ } catch { break }
          }
          if (-not $p.HasExited) { $p.Kill() }
          $mib = [math]::Round($peak / 1MB, 1)
          Write-Host "MEMORY standard(net48) peak working set = $mib MiB (samples=$n)"
          if ($n -eq 0) { throw "标准版内存采样失败：GUI 未存活，可能一启动就崩" }
          "standard(net48)             peak=$mib MiB  samples=$n" | Out-File -Append -Encoding utf8 native/windows/dist/memory.txt

      - name: 上传 GUI 截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flare-windows-shots-${{ steps.v.outputs.version }}
          path: native/windows/dist/shots/*
          if-no-files-found: warn
          retention-days: 30

      - name: NSIS 打包
        shell: pwsh
        run: |
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) {
            choco install nsis -y --no-progress | Out-Null
            $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not (Test-Path $mk)) { throw "找不到 makensis" }
          Push-Location native/windows
          & $mk -INPUTCHARSET UTF8 `
            "-DVERSION=${{ steps.v.outputs.version }}" `
            "-DNUMVERSION=${{ steps.v.outputs.numver }}" `
            "-DSRCDIR=dist\pkg" `
            "-DOUTDIR=dist" `
            installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败" }
          Pop-Location
          Get-ChildItem native/windows/dist/*.exe | Select-Object Name, Length

      - name: 校验安装包
        shell: pwsh
        run: |
          $setup = "native/windows/dist/flare-${{ steps.v.outputs.version }}-win-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "安装包未生成：$setup" }
          $mb = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          Write-Host "安装包大小: $mb MB"
          if ($mb -gt 20) { Write-Warning "超过飞书单文件 20MB 上限，需要拆分或换分发方式" }

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: flare-windows-x64-${{ steps.v.outputs.version }}
          path: native/windows/dist/flare-*-setup.exe
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # Win7 兼容版：.NET 6 自包含发布，把运行时整个打进安装包
  #
  # 为什么需要它：标准版依赖系统自带的 .NET Framework 4.8，而 Windows 7 SP1
  # 只带 3.5.1。装 4.8 要先补 SHA-2 补丁链（KB4490628 → KB4474419）再管理员安装
  # 再重启，Win7 上失败率高到不可接受（真实用户就卡在「缺少 .NET Framework v4.8」）。
  # 而 .NET 8 桌面运行时同样是「让用户先装 55MB」的另一条坑。
  # .NET 6 自包含把 CoreCLR + WPF + UCRT 全随包携带，Win7 SP1 裸机零依赖运行，
  # 不需要管理员、不需要重启、不需要联网装任何东西。
  #
  # 两个版本并存，装到同一目录，二选一安装（换版本先卸载）。
  # ==========================================================================
  compat:
    runs-on: windows-latest      # x64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 版本号
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $m = Select-String -Path 'CMakeLists.txt' -Pattern 'project\(flare-client VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
            if ($m) { $base = $m.Matches[0].Groups[1].Value } else { $base = '0.0.0' }
            $v = "$base-dev." + "${{ github.sha }}".Substring(0,7)
          }
          if ($v -match '^(\d+)\.(\d+)\.(\d+)$' -or $v -match '^(\d+)\.(\d+)\.(\d+)[-.+]') {
            $num = "$($matches[1]).$($matches[2]).$($matches[3])"
          } else {
            $num = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "numver=$num" >> $env:GITHUB_OUTPUT
          Write-Host "VERSION=$v NUMVER=$num"

      # ---------- 引擎（Go / windows amd64，与标准版同源） ----------
      - name: 取引擎源码
        shell: pwsh
        env:
          ENGINE_SSH_KEY: ${{ secrets.ENGINE_SSH_KEY }}
        run: |
          $dir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          ssh-keyscan -t ed25519 github.com 2>$null | Out-File -Append -Encoding ascii "$dir\known_hosts"
          $key = ($env:ENGINE_SSH_KEY -replace "`r","").TrimEnd("`n") + "`n"
          [System.IO.File]::WriteAllText("$dir\engine_key", $key)
          icacls "$dir\engine_key" /inheritance:r /grant:r "${env:USERNAME}:R" | Out-Null
          git config --global core.sshCommand "ssh -i `"$dir/engine_key`" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:raymond202202/flare.git engine
          if ($LASTEXITCODE -ne 0) { throw "引擎仓 clone 失败" }
          Push-Location engine; Write-Host "engine commit: $(git rev-parse --short HEAD)"; Pop-Location

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      # 引擎硬依赖 bcryptprimitives.dll（Win10 1607+ 独有），Win7 一启动就
      # throw "bcryptprimitives.dll not found"。补丁把该 DLL 缺失时的路径改走
      # advapi32!SystemFunction036（RtlGenRandom，XP 起就有），Win10+ 行为不变。
      # 只改 GOROOT 源码即可：go build 会按需重编 runtime，无需重建工具链。
      - name: 引擎打 Win7 兼容补丁（GOROOT runtime）
        shell: pwsh
        run: |
          $goroot = (go env GOROOT).Trim()
          Write-Host "GOROOT = $goroot"
          python engine/tools/patch-goroot-win7.py $goroot
          if ($LASTEXITCODE -ne 0) { throw "GOROOT 补丁失败：引擎仓库缺 tools/patch-goroot-win7.py，或 Go 版本变了补丁锚点失效" }
          python engine/tools/patch-goroot-win7.py --check $goroot
          if ($LASTEXITCODE -ne 0) { throw "GOROOT 补丁自检未通过" }

      - name: 编译引擎（windows/amd64）
        shell: pwsh
        run: |
          Push-Location engine
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          # GOTOOLCHAIN=local：否则 go.mod 里的版本号可能触发下载另一套工具链，
          # 绕过我们刚打过补丁的 GOROOT
          $env:GOTOOLCHAIN = "local"
          # GOAMD64=v1：Win7 时代的 CPU 多为不支持的 AVX2 老型号，v2/v3 会直接 illegal instruction
          $env:GOAMD64 = "v1"
          go build -trimpath -ldflags "-s -w" -o "../native/windows/engine/flare.exe" ./cmd/flare
          if ($LASTEXITCODE -ne 0) { throw "引擎编译失败" }
          Pop-Location
          & ./native/windows/engine/flare.exe --version

      # 打过 Win7 补丁的引擎取证：断言「回退路径在」且「致命 throw 已消失」。
      # 之前这里是反的（断言不能含 bcryptprimitives.dll），既然已经主动保留
      # Win10+ 走 ProcessPrng 的路径，那个断言必然失败 —— 失败原因在守卫本身。
      - name: 引擎 PE 依赖取证（Win7 兼容）
        shell: pwsh
        run: |
          $b = [System.IO.File]::ReadAllBytes("native/windows/engine/flare.exe")
          $txt = [System.Text.Encoding]::ASCII.GetString($b)
          foreach ($m in @('SystemFunction036','advapi32.dll','ProcessPrng','bcryptprimitives.dll','bcryptprimitives.dll not found','kernel32.dll')) {
            Write-Host ("{0,-32} : {1}" -f $m, $txt.Contains($m))
          }
          if (-not $txt.Contains('SystemFunction036')) {
            throw "引擎未打 Win7 兼容补丁：二进制里找不到 advapi32!SystemFunction036 回退路径"
          }
          if ($txt.Contains('bcryptprimitives.dll not found')) {
            throw "引擎仍保留 throw(bcryptprimitives.dll not found)：Win7 一启动就崩"
          }
          Write-Host "OK: 含 Win7 回退路径（advapi32!SystemFunction036）；Win10+ 仍走 bcryptprimitives!ProcessPrng"

      # ---------- 客户端（WPF / net6.0-windows 自包含） ----------
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: 发布自包含 WPF（net6.0-windows）
        shell: pwsh
        run: |
          $pkg = "native/windows/dist/compat-pkg"
          Remove-Item -Recurse -Force native/windows/dist -ErrorAction SilentlyContinue
          dotnet publish native/windows/FlareWin.csproj `
            -c Release `
            -f net6.0-windows `
            -r win-x64 `
            --self-contained true `
            -p:EnableWindowsTargeting=true `
            -p:Version=${{ steps.v.outputs.numver }} `
            -p:FileVersion=${{ steps.v.outputs.numver }}.0 `
            -p:AssemblyVersion=${{ steps.v.outputs.numver }}.0 `
            -o $pkg
          if ($LASTEXITCODE -ne 0) { throw "自包含发布失败" }

      - name: 精简运行时体积
        shell: pwsh
        run: |
          $pkg = "native/windows/dist/compat-pkg"
          # WPF 不引用的 WinForms 与诊断组件，删掉省 ~15MB
          $junk = @(
            'System.Windows.Forms.dll','System.Windows.Forms.Design.dll',
            'System.Windows.Forms.Primitives.dll','System.Windows.Forms.DataVisualization.dll',
            'mscordaccore.dll','mscordbi.dll','createdump.exe',
            'Microsoft.DiaSymReader.Native.amd64.dll','Accessibility.dll'
          )
          Get-ChildItem $pkg -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $junk -contains $_.Name } | Remove-Item -Force
          Get-ChildItem $pkg -Filter 'mscordaccore_amd64_amd64_*.dll' -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem $pkg -Filter *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force
          # 删除后必须还能自检：缺了 coreclr/hostfxr 说明删过头
          foreach ($f in @('Flare.exe','coreclr.dll','hostfxr.dll','PresentationFramework.dll','ucrtbase.dll')) {
            if (-not (Test-Path "$pkg/$f")) { throw "精简后缺少关键文件: $f" }
          }
          if (-not (Test-Path "$pkg/engine/flare.exe")) { throw "engine/flare.exe 未随发布输出，检查 csproj 的 None Update 规则" }
          Copy-Item "native/windows/README-WIN7.txt" "$pkg/README.txt"
          $sz = (Get-ChildItem -Recurse $pkg | Measure-Object -Property Length -Sum).Sum
          Write-Host ("解包后体积: {0:N1} MB / {1} 个文件" -f ($sz/1MB), (Get-ChildItem -Recurse -File $pkg).Count)

      # 兼容版壳（net6.0-windows 自包含）此前从未被真正启动过：标准版能跑不代表
      # 它能跑，自包含布局 / PresentationFramework 加载 / UCRT 都是另一条路径。
      # 这一步起真进程、断言活过采样周期、断言出图，同时采峰值工作集做内存对比。
      - name: GUI 冒烟 + 内存采样（兼容版）
        shell: pwsh
        run: |
          $pkg   = "native/windows/dist/compat-pkg"
          $shots = "native/windows/dist/shots-compat"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $env:FLARE_GUI_DEMO      = "1"
          $env:FLARE_GUI_DEMO_PIN  = "demo-2,demo-5"
          $env:FLARE_GUI_SHOT_QUIT = "1"
          $env:FLARE_GUI_SHOT      = (Resolve-Path $shots).Path
          $env:FLARE_GUI_LOG       = Join-Path (Resolve-Path $shots).Path "gui.log"
          $env:FLARE_BIN           = (Resolve-Path "$pkg/engine/flare.exe").Path
          $exe = (Resolve-Path "$pkg/Flare.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          $peak = 0; $n = 0; $code = $null
          for ($i = 0; $i -lt 240; $i++) {
            Start-Sleep -Milliseconds 250
            if ($p.HasExited) { $code = $p.ExitCode; break }
            try { $p.Refresh(); if ($p.WorkingSet64 -gt $peak) { $peak = $p.WorkingSet64 }; $n++ } catch { break }
          }
          if (-not $p.HasExited) { $p.Kill(); $code = "killed-timeout" }
          $png = @(Get-ChildItem $shots -Filter *.png -ErrorAction SilentlyContinue)
          if (Test-Path $env:FLARE_GUI_LOG) {
            Write-Host "== compat gui.log (last 30) =="
            Get-Content -Encoding UTF8 $env:FLARE_GUI_LOG | Select-Object -Last 30
          }
          $mib = [math]::Round($peak / 1MB, 1)
          Write-Host "MEMORY compat(net6 self-contained) peak working set = $mib MiB (samples=$n, png=$($png.Count), exit=$code)"
          if ($n -eq 0) { throw "兼容版 GUI 未存活过任何采样周期：一启动就崩（自包含壳在本环境不可用）" }
          if ($png.Count -eq 0) { throw "兼容版 GUI 未产出任何 png：进程活着但渲染失败" }
          "compat(net6 self-contained) peak=$mib MiB  samples=$n  png=$($png.Count)  exit=$code" | Out-File -Append -Encoding utf8 native/windows/dist/memory.txt
          $png | Select-Object Name, Length | Format-Table -AutoSize

      - name: 上传兼容版 GUI 截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flare-windows-shots-compat-${{ steps.v.outputs.version }}
          path: native/windows/dist/shots-compat/*
          if-no-files-found: warn
          retention-days: 30

      - name: NSIS 打包（兼容版）
        shell: pwsh
        run: |
          $mk = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $mk)) { choco install nsis -y --no-progress | Out-Null }
          if (-not (Test-Path $mk)) { throw "找不到 makensis" }
          Push-Location native/windows
          & $mk -INPUTCHARSET UTF8 `
            "-DVERSION=${{ steps.v.outputs.version }}" `
            "-DNUMVERSION=${{ steps.v.outputs.numver }}" `
            "-DSRCDIR=dist/compat-pkg" `
            "-DOUTDIR=dist" `
            installer-compat.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败" }
          Pop-Location
          $setup = "native/windows/dist/flare-${{ steps.v.outputs.version }}-win-x64-compat-setup.exe"
          if (-not (Test-Path $setup)) { throw "兼容版安装包未生成" }
          Write-Host ("兼容版安装包: {0:N1} MB" -f ((Get-Item $setup).Length/1MB))

      - name: 上传兼容版安装包
        uses: actions/upload-artifact@v4
        with:
          name: flare-windows-x64-compat-${{ steps.v.outputs.version }}
          path: native/windows/dist/flare-*-compat-setup.exe
          if-no-files-found: error
          retention-days: 30
