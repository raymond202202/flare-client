  <!-- 火焰（红橙黄渐变） -->
  <path d="M72.5 39C65.5 48 58 55.5 58 65.5C58 71.5 60.9 76.3 64.5 79.2C63.3 72.5 65.6 66.8 69.9 61.6C72.7 68.8 77.6 73.4 80.2 78.4C83.1 83.9 81.3 89.9 77.3 93.2C82.1 91.2 85.2 87 85.2 81.8C85.2 76.1 81.9 69.7 78.7 64.6C76.9 61.6 74.7 58.8 72.5 39Z" fill="url(#flame)"/>
  <!-- 火星（橙） -->
  <circle cx="76.5" cy="87" r="3.5" fill="#f97316" fill-opacity="0.55"/>
  <circle cx="69" cy="83" r="2.5" fill="#ef4444" fill-opacity="0.4"/>
